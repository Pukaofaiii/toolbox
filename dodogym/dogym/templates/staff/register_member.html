{% extends 'base.html' %}

{% block content %}

<div class="bg-[#333] min-h-screen flex items-center justify-center">

    <!-- ฟอร์มลงทะเบียนสมาชิกใหม่ -->
    <div class="max-w-4xl w-full bg-white p-6 rounded-lg shadow-md mt-8 border-l-4 border-orange-500">
        <h2 class="text-2xl font-semibold text-center text-gray-700 mb-6">ลงทะเบียนสมาชิกใหม่</h2>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <!-- ชื่อจริงและนามสกุล -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <div class="flex flex-col">
                    <label for="first_name" class="text-bold text-md text-black">ชื่อ</label>
                    {{ form.first_name }}
                </div>
                <div class="flex flex-col">
                    <label for="last_name" class="text-bold text-md text-black">นามสกุล</label>
                    {{ form.last_name }}
                </div>
            </div>

            <!-- รหัสบัตรประชาชน -->
            <div class="flex flex-col">
                <label for="id_card" class="text-bold text-md text-black">รหัสบัตรประชาชน</label>
                {{ form.id_card }}
            </div>

            <!-- วันเกิดและเพศ -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <div class="flex flex-col">
                    <label for="birth_date" class="text-bold text-md text-black">วันเกิด</label>
                    {{ form.birth_date }}
                </div>
                <div class="flex flex-col">
                    <label for="gender" class="text-bold text-md text-black">เพศ</label>
                    {{ form.gender }}
                </div>
            </div>

            <!-- น้ำหนักและส่วนสูง -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <div class="flex flex-col">
                    <label for="weight" class="text-bold text-md text-black">น้ำหนัก (กก.)</label>
                    {{ form.weight }}
                </div>
                <div class="flex flex-col">
                    <label for="height" class="text-bold text-md text-black">ส่วนสูง (ซม.)</label>
                    {{ form.height }}
                </div>
            </div>

            <!-- เบอร์โทรศัพท์ -->
            <div class="flex flex-col">
                <label for="phone_number" class="text-bold text-md text-black">เบอร์โทรศัพท์</label>
                {{ form.phone_number }}
            </div>

            <!-- ปุ่มบันทึกข้อมูล -->
            <button type="submit" class="w-full bg-orange-500 text-white py-2 rounded-lg hover:bg-orange-600 transition">
                บันทึกข้อมูล
            </button>
        </form>
    </div>

    
    <div class="absolute bottom-6 left-6">
        <a href="{% url 'staff_dashboard' %}" class="bg-orange-500 text-white px-6 py-3 rounded-lg hover:bg-orange-600 transition ease-in-out duration-200 shadow-md transform hover:scale-105">
            ย้อนกลับ
        </a>
    </div>

</div>
{% endblock %}
