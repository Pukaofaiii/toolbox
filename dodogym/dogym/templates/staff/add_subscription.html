{% extends 'base.html' %}

{% block content %}
<!-- พื้นหลังสี #333 -->
<div class="bg-[#333] min-h-screen flex justify-center items-center">

    <!-- ฟอร์มเพิ่มวันใช้งานสมาชิก -->
    <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-lg">
        <h2 class="text-2xl font-semibold text-center text-gray-700 mb-6">เพิ่มวันใช้งานสมาชิก</h2>

        <form method="POST" class="space-y-4">
            {% csrf_token %}

            <!-- ฟอร์มค้นหาผู้ใช้ -->
            <label class="block text-gray-600">ค้นหาผู้ใช้ (ชื่อ / รหัสบัตรประชาชน / เบอร์โทรศัพท์)</label>
            <input type="text" name="query" class="w-full p-2 border border-orange-500 rounded-lg focus:ring focus:ring-orange" required>

            <!-- ปุ่มค้นหา -->
            <button type="submit" class="w-full bg-orange-500 text-white py-2 rounded-lg hover:bg-orange-600 transition">
                ค้นหา
            </button>
        </form>

        {% if member %}
            <!-- ฟอร์มเพิ่มวันใช้งานเมื่อเลือกสมาชิกแล้ว -->
            <h3 class="mt-6 text-xl font-semibold text-center">สมาชิกที่เลือก: {{ member.first_name }} {{ member.last_name }}</h3>
            <form method="POST" class="space-y-4 mt-4">
                {% csrf_token %}
                <input type="hidden" name="query" value="{{ member.id_card }}">

                <label class="block text-gray-600">จำนวนวันที่ต้องการเพิ่ม:</label>
                <input type="number" name="days" min="1" class="w-full p-2 border border-orange-500 rounded-lg focus:ring focus:ring-blue-300" required>

                <button type="submit" class="w-full bg-orange-700 text-white py-2 rounded-lg hover:bg-orange-700 transition">
                    เพิ่มวันใช้งาน
                </button>
            </form>
        {% endif %}

        <!-- ปุ่มย้อนกลับไปที่ Dashboard (อยู่ที่มุมล่างซ้าย) -->
    <div class="absolute bottom-6 left-6">
        <a href="{% url 'staff_dashboard' %}" class="bg-orange-500 text-white px-6 py-3 rounded-lg hover:bg-orange-600 transition ease-in-out duration-200 shadow-md transform hover:scale-105">
            ย้อนกลับ
        </a>
        </div>
    </div>

</div>
{% endblock %}
